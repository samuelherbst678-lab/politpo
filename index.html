<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Konklave Final</title>

<style>
body { font-family: Arial; text-align:center; background:#f4f4f4; }

.wrapper { max-width:1100px; margin:auto; }

/* PAPAM */
.papam {
    display:none;
    background:linear-gradient(135deg,gold,#fff3b0);
    padding:20px;
    margin:20px auto;
    max-width:700px;
    border:2px solid #d4af37;
    white-space:pre-line;
}

/* LEGEND */
.legend {
    position:fixed;
    right:10px;
    top:10px;
    background:white;
    padding:8px;
    border:1px solid #aaa;
    font-size:12px;
}

/* CARDS */
.container {
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.card {
    width:200px;
    background:white;
    border:1px solid #aaa;
    position:relative;
}

.img {
    height:130px;
    background:#ddd;
    background-size:cover;
}

.delete-btn {
    position:absolute;
    top:3px;
    right:4px;
    font-size:10px;
    background:red;
    color:white;
    border:none;
}

input, textarea {
    width:90%;
    margin:3px;
    text-align:center;
}

.type {
    display:flex;
    justify-content:center;
    align-items:center;
    height:22px;
    font-size:12px;
    color:white;
    cursor:pointer;
}

/* MATRIX */
table {
    border-collapse:collapse;
    margin:30px auto;
    background:white;
}

td,th {
    border:1px solid #aaa;
    padding:6px;
}

.gold {
    outline:3px solid gold;
}
</style>
</head>

<body>

<div class="legend" id="legend"></div>

<div class="wrapper">

<h2>Konklave</h2>

<button onclick="addCard()">+ Kandidat</button>
<div class="container" id="cards"></div>

<hr>

Vorname: <input id="first">
Nachname: <input id="last">
Papstname: <input id="pope">

<br><br>

<button onclick="showPapam()">Habemus Papam anzeigen</button>

<div class="papam" id="papam"></div>

<hr>

Wähler: <input id="total" value="120" oninput="updateThreshold()">
→ 2/3 = <span id="thresholdDisplay">80</span>

<br><br>

<button onclick="addRound()">+ Wahlgang</button>

<table>
<thead><tr id="header"><th>WG</th></tr></thead>
<tbody id="body"></tbody>
</table>

</div>

<script>

/* ===== SKALA ===== */
const labels={
EK:"Erzkonservativ",
KON:"Konservativ",
GK:"Gemäßigt konservativ",
MOD:"Moderat",
GL:"Gemäßigt liberal",
LIB:"Liberal",
PRO:"Progressiv"
};

const colors={
EK:"#000080",
KON:"#0F52BA",
GK:"#3B77D4",
MOD:"#C2B280",
GL:"#FF4545",
LIB:"#FF0000",
PRO:"#CC0000"
};

const types=Object.keys(labels);

/* ===== LEGENDE ===== */
function buildLegend(){
    const l=document.getElementById("legend");
    l.innerHTML="<b>Ausrichtungen</b>";

    types.forEach(t=>{
        const d=document.createElement("div");
        d.innerHTML=`
        <span style="background:${colors[t]};width:15px;height:10px;display:inline-block;margin-right:5px"></span>
        ${t} - ${labels[t]}
        `;
        l.appendChild(d);
    });
}

/* ===== DATEN ===== */
let candidates=[];
let rounds=[];
let threshold=80;

/* ===== KARTEN ===== */
function addCard(){
    candidates.push({name:"",nation:"",age:"",role:"",type:null,img:null});
    renderAll();
}

function removeCard(i){
    candidates.splice(i,1);
    renderAll();
}

function renderCards(){
    const c=document.getElementById("cards");
    c.innerHTML="";

    candidates.forEach((cand,i)=>{
        const div=document.createElement("div");
        div.className="card";

        div.innerHTML=`
        <button class="delete-btn" onclick="removeCard(${i})">x</button>
        <div class="img"></div>

        <input placeholder="Name" value="${cand.name}" 
        onchange="candidates[${i}].name=this.value; renderMatrix()">

        <input placeholder="Nation" value="${cand.nation}" 
        onchange="candidates[${i}].nation=this.value">

        <input placeholder="Alter" value="${cand.age}" 
        onchange="candidates[${i}].age=this.value">

        <textarea placeholder="Rolle" 
        onchange="candidates[${i}].role=this.value">${cand.role}</textarea>

        <div class="type" onclick="cycleType(${i})">
            ${cand.type||"---"}
        </div>
        `;

        const imgDiv=div.querySelector(".img");
        if(cand.img) imgDiv.style.backgroundImage=`url(${cand.img})`;

        imgDiv.onclick=()=>{
            const input=document.createElement("input");
            input.type="file";
            input.onchange=e=>{
                const r=new FileReader();
                r.onload=ev=>{
                    candidates[i].img=ev.target.result;
                    renderCards();
                };
                r.readAsDataURL(e.target.files[0]);
            };
            input.click();
        };

        if(cand.type){
            div.querySelector(".type").style.background=colors[cand.type];
        }

        c.appendChild(div);
    });
}

function cycleType(i){
    let idx=types.indexOf(candidates[i].type);
    idx=(idx+1)%types.length;
    candidates[i].type=types[idx];
    renderCards();
}

/* ===== MATRIX ===== */
function renderMatrix(){
    const h=document.getElementById("header");
    h.innerHTML="<th>WG</th>";

    candidates.forEach(c=>{
        const th=document.createElement("th");
        th.innerText=c.name||"-";
        h.appendChild(th);
    });

    const body=document.getElementById("body");
    body.innerHTML="";

    rounds.forEach((r,ri)=>{
        const tr=document.createElement("tr");

        let row=`<td>WG ${ri+1}</td>`;

        candidates.forEach((c,ci)=>{
            row+=`<td>
            <input type="number" value="${r[ci]||0}"
            oninput="updateVote(${ri},${ci},this.value)">
            </td>`;
        });

        tr.innerHTML=row;
        body.appendChild(tr);
    });
}

function addRound(){
    rounds.push([]);
    renderMatrix();
}

function updateVote(r,c,val){
    rounds[r][c]=Number(val);
    check();
}

/* ===== LOGIK ===== */
function updateThreshold(){
    const total=Number(document.getElementById("total").value)||0;
    threshold=Math.ceil((2/3)*total);
    document.getElementById("thresholdDisplay").innerText=threshold;
}

function check(){
    document.querySelectorAll("#body tr").forEach(row=>{
        row.querySelectorAll("input").forEach(i=>{
            i.classList.remove("gold");
            if(Number(i.value)>=threshold){
                i.classList.add("gold");
                showPapam();
            }
        });
    });
}

/* ===== HABEMUS PAPAM ===== */
function showPapam(){
    const first=document.getElementById("first").value || "Nomen";
    const last=document.getElementById("last").value || "Nomen";
    const pope=document.getElementById("pope").value || "Nomen";

    const text=`Annuntio vobis gaudium magnum:
Habemus Papam!

Eminentissimum ac reverendissimum Dominum,
Dominum ${first} Sanctae Romanae Ecclesiae Cardinalem ${last},
qui sibi nomen imposuit ${pope}.`;

    const box=document.getElementById("papam");
    box.style.display="block";
    box.innerText=text;
}

/* ===== RENDER ===== */
function renderAll(){
    renderCards();
    renderMatrix();
}

/* START */
buildLegend();
updateThreshold();
addCard();addCard();addCard();

</script>

</body>
</html>
